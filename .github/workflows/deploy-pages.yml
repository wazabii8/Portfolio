name: Deploy to GitHub Pages

# Manual only, so a push to main never changes the live site by itself.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy replaces a queued one, but never cancels one already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The site is plain HTML/CSS, so the repository root is published as is.
      # The artifact action already leaves out .git and .github.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
